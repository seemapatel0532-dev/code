{% extends "base.html" %}
{% block content %}

<div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
  <div>
    <h3 class="mb-1">Ranking Progress</h3>
    <div class="text-muted">Run #{{ run.id }} • {{ run.jd_title or 'JD' }}</div>
  </div>
  <a class="btn btn-cs-outline" href="{{ url_for('ranker.index') }}">
    <i class="bi bi-arrow-left me-1"></i>Back
  </a>
</div>

<div class="card cs-card">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between">
      <div>
        <div class="text-muted small">Status</div>
        <div class="fs-5 fw-semibold" id="statusText">{{ run.status }}</div>
      </div>
      <div class="text-muted small" id="countText">{{ run.processed_files }}/{{ run.total_files }}</div>
    </div>

    <div class="progress mt-3" style="height: 10px;">
      <div class="progress-bar" id="bar" style="width: 5%"></div>
    </div>

    <div class="alert alert-danger mt-3 d-none" id="errBox"></div>

    <div class="mt-3 d-flex gap-2 flex-wrap">
      <a class="btn btn-cs d-none" id="goResults" href="{{ url_for('ranker.results', run_id=run.id) }}">
        <i class="bi bi-table me-1"></i>View Results
      </a>
    </div>
  </div>
</div>

<script>
  const runId = {{ run.id }};
  const statusText = document.getElementById("statusText");
  const countText = document.getElementById("countText");
  const bar = document.getElementById("bar");
  const errBox = document.getElementById("errBox");
  const goResults = document.getElementById("goResults");

  function pct(done, total){
    if(!total || total <= 0) return 5;
    return Math.max(5, Math.min(100, Math.round((done/total)*100)));
  }

  async function poll(){
    const res = await fetch(`/ranker/api/progress/${runId}`);
    const data = await res.json();

    statusText.textContent = data.status;
    countText.textContent = `${data.processed_files}/${data.total_files}`;
    bar.style.width = `${pct(data.processed_files, data.total_files)}%`;

    if(data.status === "failed"){
      errBox.classList.remove("d-none");
      errBox.textContent = data.error || "Run failed.";
      return;
    }

    if(data.status === "done"){
      goResults.classList.remove("d-none");
      CareerSetu.toast("Ranking completed ✅", "success");
      return;
    }

    setTimeout(poll, 1200);
  }

  poll();
</script>

{% endblock %}
