{% extends "base.html" %}
{% block content %}

<div class="d-flex align-items-start justify-content-between mb-4 flex-wrap gap-2">
  <div>
    <h3 class="mb-1">Cover Letter</h3>
    <div class="text-muted">Generate an editable cover letter from your Builder profile + job description.</div>
  </div>
  <div class="d-flex gap-2 flex-wrap">
    <a class="btn btn-cs-outline" href="{{ url_for('assistant.optimizer_page') }}">
      <i class="bi bi-stars me-1"></i>Optimizer
    </a>
    <a class="btn btn-cs" href="{{ url_for('builder.view') }}" target="_blank">
      <i class="bi bi-eye me-1"></i>Resume Preview
    </a>
  </div>
</div>

<div class="row g-3">
  <div class="col-lg-5">
    <div class="card cs-card">
      <div class="card-body">
        <h5 class="mb-3"><i class="bi bi-briefcase me-2"></i>Job Details</h5>

        <label class="form-label">Company</label>
        <input id="company" class="form-control" placeholder="e.g., Infosys">

        <label class="form-label mt-3">Role</label>
        <input id="role" class="form-control" placeholder="e.g., Backend Developer">

        <label class="form-label mt-3">Job Description</label>
        <textarea id="jdText" class="form-control" rows="10" placeholder="Paste the job description here..."></textarea>

        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-cs w-100" id="btnGen">
            <i class="bi bi-magic me-2"></i>Generate
          </button>
          <button class="btn btn-cs-outline" id="btnRegen">
            <i class="bi bi-arrow-clockwise me-1"></i>Regenerate
          </button>
        </div>

        <div class="small text-muted mt-3">
          Downloads use the edited content from the editor.
        </div>
      </div>
    </div>

    <div class="card cs-card mt-3">
      <div class="card-body">
        <h5 class="mb-3"><i class="bi bi-download me-2"></i>Download</h5>

        <form method="POST" action="{{ url_for('assistant.cover_letter_download_pdf') }}" class="d-grid gap-2">
          <input type="hidden" name="company" id="pdf_company">
          <input type="hidden" name="role" id="pdf_role">
          <input type="hidden" name="jd_text" id="pdf_jd">
          <input type="hidden" name="letter" id="pdf_letter">
          <button class="btn btn-cs-outline" type="submit"><i class="bi bi-filetype-pdf me-2"></i>Download PDF</button>
        </form>

        <form method="POST" action="{{ url_for('assistant.cover_letter_download_docx') }}" class="d-grid gap-2 mt-2">
          <input type="hidden" name="company" id="docx_company">
          <input type="hidden" name="role" id="docx_role">
          <input type="hidden" name="jd_text" id="docx_jd">
          <input type="hidden" name="letter" id="docx_letter">
          <button class="btn btn-cs" type="submit"><i class="bi bi-filetype-docx me-2"></i>Download DOCX</button>
        </form>

      </div>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="card cs-card">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
          <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editor</h5>
          <button class="btn btn-sm btn-cs-outline" id="btnCopy">
            <i class="bi bi-clipboard me-1"></i>Copy
          </button>
        </div>

        <textarea id="letter" class="form-control mt-3" rows="22" placeholder="Generated letter will appear here..."></textarea>

        <div id="copyMsg" class="mt-2"></div>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/cover_letter.js') }}"></script>
{% endblock %}
